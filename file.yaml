services:
  - type: web
    name: ai-insights-hub
    env: static
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: .
    routes:
      - type: redirect
        source: /login
        destination: /auth/login.html
      - type: redirect
        source: /signup
        destination: /auth/signup.html
      - type: redirect
        source: /dashboard
        destination: /auth/dashboard.html
      - type: redirect
        source: /pricing
        destination: /pages/pricing.html
      - type: rewrite
        source: /*
        destination: /index.html
